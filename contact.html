<!doctype html>
<html lang="fr">
  <head>
    <title>Site 1 - Démo</title>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="texte.css" />
    <script src="texte.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Hello Couvin</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>
    <main>
      <section>
        <h2>Contacter nous</h2>
        <div class="colonnes">
          <div class="colonne">Formulaire</div>
          <h3>Par email</h3>
          <form>
            <div class="control">
              <label for="lastname">Nom</label>
              <input type="text" id="lastname" required />*
            </div>
            <div class="control">
              <label for="firstname">Prénom</label>
              <input type="text" id="firstname" required />*
            </div>
            <div class="control">
              <label for="email">Email</label>
              <input
                type="email"
                required
                id="email"
                placeholder="user@site.com"
              />*
            </div>
            <div class="control">
              <label for="profil"> Profil</label>
              <select name="" id="">
                profil
                <option value="DE">Demandeur d'emploie</option>
                <option value="TRAV">Travailleur</option>
              </select>
            </div>
            <div class="control">
              <label for="message">Message</label>
              <textarea name="" id="message"></textarea>
            </div>
            <div class="control">
              <label for=""></label>
              <button>Envoyer</button>
            </div>
          </form>
          <div class="colonne">
            <iframe
              width="425"
              height="350"
              src="https://www.openstreetmap.org/export/embed.html?bbox=4.385433197021485%2C50.002332832505736%2C4.61202621459961%2C50.101312879065375&amp;layer=mapnik"
              style="border: 1px solid black"
            ></iframe
            ><br /><small
              ><a href="https://www.openstreetmap.org/?#map=13/50.05185/4.49873"
                >View Larger Map</a
              ></small
            >
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
